name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  templates:
    name: cfn-lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to point
      # at different code after review.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint ./*.yml

  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: shellcheck ./*.sh

  # Advisory only. Checkov is useful for spotting drift, but gating on it pushes
  # a small template toward enabling WAF/logging/versioning unconditionally,
  # which is exactly the cargo cult this repo tries to keep optional. Read the
  # findings; do not auto-fix them.
  checkov:
    name: checkov (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install checkov
      - run: checkov -d . --framework cloudformation --soft-fail
