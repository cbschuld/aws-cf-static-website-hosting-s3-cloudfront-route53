AWSTemplateFormatVersion: "2010-09-09"
Description: "Static HTTPS website hosting with CloudFront, S3 and Route53"

Parameters:
  DomainName:
    Type: String
    Default: "domain.name"
    Description: "Root Domain name for the DNS Updates (e.g. domain.name)"
  AppDomainName:
    Type: String
    Default: "app.domain.name"
    Description: "Domain name for the website (e.g. app.domain.name)"
  CertificateARN:
    Type: String
    Default: "certificate:arn:from:us-east-1"
    Description: "The Certificate's ARN from the us-east-1 region for CloudFront to bind to"

Resources:
  # Private bucket holding the website files. It is never public: CloudFront
  # reads it via Origin Access Control (OAC) and the bucket policy below.
  S3Bucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Ref AppDomainName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Grant read access only to this distribution via the CloudFront service
  # principal, scoped by SourceArn so no other distribution can use the bucket.
  ReadPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Action: "s3:GetObject"
            Effect: Allow
            Resource: !Sub "arn:aws:s3:::${S3Bucket}/*"
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # Origin Access Control (OAC) — the modern replacement for OAI. Signs every
  # origin request with SigV4 so the bucket can stay fully private.
  CloudFrontOriginAccessControl:
    Type: "AWS::CloudFront::OriginAccessControl"
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AppDomainName}-oac"
        Description: !Sub "OAC for ${AppDomainName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Security response headers applied to every viewer response.
  SecurityHeadersPolicy:
    Type: "AWS::CloudFront::ResponseHeadersPolicy"
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AppDomainName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true

  # Configure CloudFront
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref AppDomainName
        # React/other SPA-style applications require these. With OAC, S3 returns
        # 403 for missing objects, so both 403 and 404 are routed to index.html.
        CustomErrorResponses:
          - ErrorCode: 403 # forbidden
            ResponseCode: 200
            ResponsePagePath: "/index.html"
          - ErrorCode: 404 # not found
            ResponseCode: 200
            ResponsePagePath: "/index.html"
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          DefaultTTL: 3600 # in seconds
          ForwardedValues:
            Cookies:
              Forward: none
            QueryString: false
          MaxTTL: 86400 # in seconds
          MinTTL: 60 # in seconds
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          TargetOriginId: s3origin
          ViewerProtocolPolicy: "redirect-to-https"
        DefaultRootObject: "index.html"
        Enabled: true
        HttpVersion: http2
        Origins:
          - DomainName: !GetAtt "S3Bucket.RegionalDomainName"
            Id: s3origin
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: "PriceClass_100" # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-cloudfront-distribution-distributionconfig.html#cfn-cloudfront-distribution-distributionconfig-priceclass
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateARN
          SslSupportMethod: "sni-only"
          MinimumProtocolVersion: "TLSv1.2_2021"
  DomainDNSName:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Join ["", [!Ref DomainName, .]]
      RecordSets:
        - Name: !Ref AppDomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt [CloudFrontDistribution, DomainName]
            HostedZoneId: Z2FDTNDATAQYW2 #always use Z2FDTNDATAQYW2 for CloudFront
Outputs:
  Bucket:
    Description: "S3 Bucket Name"
    Value: !Ref S3Bucket
  DistributionId:
    Description: "CloudFront Distribution ID"
    Value: !Ref CloudFrontDistribution
  Domain:
    Description: "Cloudfront Domain"
    Value: !GetAtt CloudFrontDistribution.DomainName
